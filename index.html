<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一級建築士</title>
  <style>
    body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:20px}
  </style>
</head>
<body>
  <div id="root">読み込み中...</div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script>
    // app.jsを動的に読み込んで、完了後にマウント
    var s = document.createElement('script');
    s.src = 'app.js';
    s.onload = function() {
      console.log('app.js loaded, App=', typeof window.App);
      try {
        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(window.App));
      } catch(e) {
        document.getElementById('root').innerHTML =
          '<pre style="color:#f87171;font-size:12px">' + e.stack + '</pre>';
      }
    };
    s.onerror = function() {
      document.getElementById('root').innerHTML =
        '<p style="color:#f87171">app.js の読み込みに失敗しました</p>';
    };
    document.head.appendChild(s);
  </script>
</body>
</html>
