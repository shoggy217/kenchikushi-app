<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一級建築士">
  <meta name="theme-color" content="#000000">
  <title>一級建築士 学習アプリ</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}
    #root{min-height:100vh}
    button{cursor:pointer;border:none}
    input,textarea,select{outline:none}
    ::-webkit-scrollbar{display:none}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:rgba(255,255,255,0.3);font-size:14px">読み込み中...</div>
  </div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="app.js"></script>
  <script>
    try{
      ReactDOM.createRoot(document.getElementById('root'))
        .render(React.createElement(window.App));
    }catch(e){
      document.getElementById('root').innerHTML=
        '<pre style="color:#f87171;padding:20px;font-size:11px;white-space:pre-wrap">'+e.stack+'</pre>';
    }
  </script>
  <script>
    // Service Worker 登録＋自動更新
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 定期的に更新チェック（アプリを開いている間・1時間ごと）
          setInterval(function () { reg.update(); }, 60 * 60 * 1000);
          // 起動直後にも更新確認
          reg.update();
          // 新しいSWが見つかったら、準備完了後に自動で切り替え
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              // 新SWがインストール済み＆既存SWが制御中 = 更新あり
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(function () {});
        // 新SWが有効化されたら一度だけ自動リロードして最新を反映
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
  <script>
  // KaTeX 自動描画: React再描画のたびにDOMを走査し、未処理の数式(\\(...\\) / \\[...\\])を描画する。
  // 区切りは \\( \\) と \\[ \\] のみ($は金額表記と誤爆するため使わない)。
  (function(){
    function renderAll(){
      if (!window.renderMathInElement) return;
      var root = document.getElementById('root');
      if (!root) return;
      try {
        window.renderMathInElement(root, {
          delimiters: [
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false }
          ],
          throwOnError: false,
          ignoredClasses: ["katex"]
        });
      } catch(e) {}
    }
    var timer = null;
    function schedule(){ if (timer) clearTimeout(timer); timer = setTimeout(renderAll, 120); }
    function start(){
      var root = document.getElementById('root');
      if (!root || !window.MutationObserver) return;
      var mo = new MutationObserver(schedule);
      mo.observe(root, { childList: true, subtree: true });
      schedule();
    }
    if (document.readyState === "complete" || document.readyState === "interactive") {
      window.addEventListener("load", start);
    } else {
      window.addEventListener("DOMContentLoaded", start);
    }
  })();
  </script>
</body>
</html>
