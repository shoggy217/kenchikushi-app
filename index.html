<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一級建築士">
  <meta name="theme-color" content="#000000">
  <title>一級建築士 学習アプリ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:#000; overscroll-behavior:none; font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif; }
    #root { min-height:100vh; }
    #loading { display:flex; align-items:center; justify-content:center; min-height:100vh; color:rgba(255,255,255,0.3); font-size:14px; }
    input,textarea,select { outline:none; }
    button { cursor:pointer; }
    ::-webkit-scrollbar { display:none; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
  </style>
</head>
<body>
  <div id="root"><div id="loading">読み込み中...</div></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="app.js"></script>
  <script>
    window.addEventListener('load', function() {
      try {
        if (typeof App === 'undefined') {
          throw new Error('App が定義されていません。app.js の読み込みを確認してください。');
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
      } catch(e) {
        document.getElementById('root').innerHTML =
          '<div style="color:#f87171;padding:24px;font-size:14px;line-height:1.8">' +
          '<b>エラー:</b> ' + e.message + '</div>';
        console.error(e);
      }
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</body>
</html>
