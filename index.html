<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一級建築士">
  <meta name="theme-color" content="#000000">
  <title>一級建築士 学習アプリ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:#000; overscroll-behavior:none; font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif; }
    #root { min-height:100vh; min-height:-webkit-fill-available; }
    /* Tailwindの必要なクラスだけ定義 */
    .min-h-screen { min-height:100vh; }
    .text-white { color:#fff; }
    .flex { display:flex; }
    .flex-1 { flex:1; }
    .flex-col { flex-direction:column; }
    .items-center { align-items:center; }
    .justify-center { justify-content:center; }
    .gap-1 { gap:0.25rem; }
    .gap-2 { gap:0.5rem; }
    .gap-3 { gap:0.75rem; }
    .gap-4 { gap:1rem; }
    .space-y-3 > * + * { margin-top:0.75rem; }
    .grid { display:grid; }
    .grid-cols-2 { grid-template-columns:repeat(2,1fr); }
    .rounded-2xl { border-radius:1rem; }
    .rounded-xl { border-radius:0.75rem; }
    .rounded-lg { border-radius:0.5rem; }
    .rounded-full { border-radius:9999px; }
    .p-5 { padding:1.25rem; }
    .p-4 { padding:1rem; }
    .p-3 { padding:0.75rem; }
    .py-2 { padding-top:0.5rem; padding-bottom:0.5rem; }
    .py-3 { padding-top:0.75rem; padding-bottom:0.75rem; }
    .px-6 { padding-left:1.5rem; padding-right:1.5rem; }
    .pt-12 { padding-top:3rem; }
    .pb-6 { padding-bottom:1.5rem; }
    .pb-20 { padding-bottom:5rem; }
    .mb-1 { margin-bottom:0.25rem; }
    .mb-2 { margin-bottom:0.5rem; }
    .mb-4 { margin-bottom:1rem; }
    .mt-1 { margin-top:0.25rem; }
    .w-full { width:100%; }
    .h-full { height:100%; }
    .overflow-hidden { overflow:hidden; }
    .overflow-x-auto { overflow-x:auto; }
    .overflow-y-auto { overflow-y:auto; }
    .whitespace-nowrap { white-space:nowrap; }
    .whitespace-pre-wrap { white-space:pre-wrap; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .text-center { text-align:center; }
    .text-left { text-align:left; }
    .text-right { text-align:right; }
    .text-black { color:#000; }
    .font-medium { font-weight:500; }
    .font-semibold { font-weight:600; }
    .font-light { font-weight:300; }
    .font-bold { font-weight:700; }
    .tabular-nums { font-variant-numeric:tabular-nums; }
    .tracking-tight { letter-spacing:-0.025em; }
    .tracking-wide { letter-spacing:0.025em; }
    .leading-none { line-height:1; }
    .leading-relaxed { line-height:1.625; }
    .transition-all { transition:all 0.15s; }
    .cursor-pointer { cursor:pointer; }
    .border { border-width:1px; }
    .border-none { border:none; }
    .resize-none { resize:none; }
    .relative { position:relative; }
    .absolute { position:absolute; }
    .fixed { position:fixed; }
    .sticky { position:sticky; }
    .top-0 { top:0; }
    .z-10 { z-index:10; }
    .z-100 { z-index:100; }
    .max-w-2xl { max-width:42rem; }
    .mx-auto { margin-left:auto; margin-right:auto; }
    .flex-shrink-0 { flex-shrink:0; }
    .flex-wrap { flex-wrap:wrap; }
    .aspect-ratio { aspect-ratio:1; }
    .hidden { display:none; }
    .block { display:block; }
    .inline-flex { display:inline-flex; }
    .max-h-72 { max-height:18rem; }
    .list-decimal { list-style-type:decimal; }
    .list-inside { list-style-position:inside; }
    .min-w-0 { min-width:0; }
    .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .opacity-60 { opacity:0.6; }
    .ml-0\.5 { margin-left:0.125rem; }
    .ml-auto { margin-left:auto; }
    .mt-0\.5 { margin-top:0.125rem; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
    input, textarea, select { outline:none; }
    button { cursor:pointer; }
    ::-webkit-scrollbar { display:none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <!-- App (pre-built) -->
  <script src="app.js"></script>
  <script>
    // Mount
    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    } catch(e) {
      document.getElementById('root').innerHTML =
        '<div style="color:#f87171;padding:20px;font-family:sans-serif">' +
        'エラー: ' + e.message + '</div>';
    }
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
